<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClusterPowerShell</title>
<style>
:root{color-scheme:dark;--ui-background:#101115;--ui-panel:#191c23;--ui-control:#2a2e38;--ui-text:#e5e9f3;--ui-muted:#929bab;--ui-accent:#7e9ef4;--ui-border:#333944;--ui-hover:#343947;--ui-editor:#0c0d10}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--ui-editor);color:var(--ui-text);font:12px system-ui,sans-serif}
main{height:100%;display:flex;flex-direction:column;min-width:240px}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:43px;background:var(--ui-panel);border-bottom:1px solid var(--ui-border)}
header strong{font-size:12px;letter-spacing:.4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ui-muted)}
.dot.connected{background:var(--ui-accent)}.grow{flex:1}
button,input{background:var(--ui-control);border:1px solid var(--ui-border);color:var(--ui-text);border-radius:5px;padding:7px 9px;font:inherit}
button{cursor:pointer}button:hover{background:var(--ui-hover)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:1px}
button:disabled{opacity:.5;cursor:not-allowed}
#tabs{display:flex;align-items:center;gap:3px;overflow-x:auto;min-height:35px;background:var(--ui-panel);border-bottom:1px solid var(--ui-border);padding:0 8px;scrollbar-width:thin}
#tabs button{flex:none;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px;white-space:nowrap}
#tabs button[aria-selected="true"]{border-bottom-color:var(--ui-accent);color:var(--ui-text)}
#tabs .close-tab{font-size:15px;padding:0 5px;border:0;border-radius:3px;color:var(--ui-muted)}
#tabs .close-tab:hover{background:var(--ui-hover)}
#tabs .new-tab{font-size:17px;line-height:1;padding:5px 9px}
#output{flex:1;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 Consolas,"Cascadia Mono",monospace;padding:15px;background:var(--ui-editor)}
#output .error{color:var(--ui-accent);font-weight:600}
form{display:flex;gap:7px;padding:9px 12px;background:var(--ui-panel);border-top:1px solid var(--ui-border)}
#command{flex:1;min-width:0;background:var(--ui-background);font:12px Consolas,monospace}
#connectPanel{border-bottom:1px solid var(--ui-border);padding:11px 13px;background:var(--ui-panel)}
#connectPanel p{line-height:1.6;color:var(--ui-muted);margin:4px 0 9px}
#connectPanel .fields{display:flex;gap:6px;flex-wrap:wrap}
#endpoint{width:210px;max-width:100%}#token{flex:1;min-width:110px}
#setupGuide{margin-top:8px;padding:9px 11px;border:1px solid var(--ui-border);border-radius:6px;background:var(--ui-background)}
#setupGuide ol{margin:7px 0 8px;padding-left:18px;line-height:1.65}
#setupGuide code{font:11px Consolas,monospace;overflow-wrap:anywhere}
.guide-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
[hidden]{display:none!important}
</style></head><body><main>
<header><span class="dot" id="dot"></span><strong>PowerShell</strong>
<span class="grow"></span><button id="connectToggle" type="button" aria-expanded="true">Connect</button>
<button id="clear" type="button">Clear</button></header>
<section id="connectPanel">
<p id="hint"></p>
<div class="fields">
<input id="endpoint" aria-label="Loopback address" autocomplete="off" spellcheck="false" placeholder="http://127.0.0.1:PORT/">
<input id="token" type="password" aria-label="Session token" autocomplete="off" placeholder="Session token">
<button id="connect" type="button">Connect</button></div>
<div id="setupGuide">
<strong id="setupTitle"></strong>
<ol><li id="setupStep1"></li><li id="setupStep2"></li><li id="setupStep3"></li></ol>
<div class="guide-actions"><code>bridge\Setup-ClusterPowerShell.cmd</code>
<button id="copySetup" type="button"></button></div>
</div></section>
<nav id="tabs" role="tablist" aria-label="PowerShell sessions"></nav>
<div id="output" role="log" aria-live="polite"></div>
<form id="terminalForm">
<input id="command" autocomplete="off" spellcheck="false" aria-label="PowerShell command" disabled placeholder="PS>">
<button id="run" type="submit" disabled>Run</button>
</form>
</main><script>
/* PRMU owns shared palette and language. Connection secrets are memory-only. */
(()=>{'use strict';
const $=id=>document.getElementById(id);
const labels={
'zh-TW':['連線','清除','執行','請連接本機 Local Agent。若尚未配置，請依下方引導完成快速配置。','連線成功','連線失敗','執行失敗','未連線','新增 PowerShell','關閉分頁','Local Agent 快速配置','下載插件 Folder 包至 Windows 本機','從插件資料夾執行以下 CMD，確認授權與網站 Origin','複製 CMD 輸出的 Port URL 與 Token 至上方欄位','複製路徑','PowerShell 工作階段'],
en:['Connect','Clear','Run','Connect to your local agent. If unconfigured, follow the quick-setup guide.','Connected','Connection failed','Execution failed','Not connected','New PowerShell','Close tab','Local Agent quick setup','Download the plugin Folder package to Windows','Run the CMD from its folder and approve the website origin','Paste the printed Port URL and Token above','Copy path','PowerShell session'],
fr:['Connexion','Effacer','Exécuter','Connectez votre agent local. Sinon, suivez la configuration rapide.','Connecté','Échec de connexion','Erreur d’exécution','Non connecté','Nouveau PowerShell','Fermer','Configuration rapide','Télécharger le dossier du plugin sur Windows','Exécuter le CMD et autoriser l’origine du site','Saisir URL et jeton affichés','Copier le chemin','Session PowerShell'],
ja:['接続','消去','実行','ローカルエージェントを接続してください。未設定なら簡単設定を参照。','接続済み','接続失敗','実行失敗','未接続','新しい PowerShell','タブを閉じる','簡単設定','プラグインのフォルダーを Windows に保存','CMD を実行しサイトの Origin を許可','表示された URL と Token を入力','パスをコピー','PowerShell セッション'],
es:['Conectar','Limpiar','Ejecutar','Conecte el agente local. Si falta, siga la configuración rápida.','Conectado','Error de conexión','Error de ejecución','Sin conexión','Nuevo PowerShell','Cerrar pestaña','Configuración rápida','Descargue el paquete Folder a Windows','Ejecute CMD y autorice el origen del sitio','Introduzca URL y Token mostrados','Copiar ruta','Sesión PowerShell'],
hi:['कनेक्ट','साफ़','चलाएँ','लोकल एजेंट जोड़ें। पहले से सेट नहीं है तो त्वरित सेटअप करें।','कनेक्टेड','कनेक्शन विफल','निष्पादन विफल','कनेक्ट नहीं','नया PowerShell','टैब बंद करें','त्वरित सेटअप','Windows पर प्लगइन फ़ोल्डर डाउनलोड करें','CMD चलाएँ और वेबसाइट Origin स्वीकार करें','दिखाया गया URL और Token भरें','पथ कॉपी करें','PowerShell सत्र']
};
let locale='zh-TW',endpoint='',token='',connected=false,active=null,nextLabel=1;
const sessions=new Map();
function t(index){return (labels[locale]||labels.en)[index];}
function applyLabels(){
$('connectToggle').textContent=t(0);$('connect').textContent=t(0);
$('clear').textContent=t(1);$('run').textContent=t(2);$('hint').textContent=t(3);
$('setupTitle').textContent=t(10);$('setupStep1').textContent=t(11);
$('setupStep2').textContent=t(12);$('setupStep3').textContent=t(13);
$('copySetup').textContent=t(14);document.documentElement.lang=locale;renderTabs();
}
function escapeOutput(text,error=false){
const node=document.createElement('div');node.textContent=String(text);
if(error)node.className='error';return node;
}
function append(session,text,error=false){
session.output.push({text:String(text),error});if(session.id===active)showOutput(session);
}
function showOutput(session){
const area=$('output');area.replaceChildren(...session.output.map(x=>escapeOutput(x.text,x.error)));
area.scrollTop=area.scrollHeight;
}
function renderTabs(){
const bar=$('tabs');bar.replaceChildren();
for(const session of sessions.values()){
const button=document.createElement('button');button.type='button';button.setAttribute('role','tab');
button.dataset.id=session.id;button.setAttribute('aria-selected',String(session.id===active));
button.textContent=session.name+(session.busy?' …':'');button.onclick=()=>activate(session.id);
bar.append(button);
const close=document.createElement('button');close.type='button';close.className='close-tab';
close.textContent='×';close.title=t(9);close.setAttribute('aria-label',t(9)+' '+session.name);
close.onclick=()=>closeSession(session.id);bar.append(close);
}
const add=document.createElement('button');add.type='button';add.className='new-tab';
add.textContent='+';add.disabled=!connected;add.title=t(8);add.setAttribute('aria-label',t(8));
add.onclick=createSession;bar.append(add);
}
function activate(id){
const s=sessions.get(id);if(!s)return;
if(active&&sessions.has(active))sessions.get(active).draft=$('command').value;
active=id;$('command').value=s.draft||'';showOutput(s);renderTabs();syncInput();
}
function syncInput(){
const s=sessions.get(active),enabled=connected&&!!s&&!s.busy;
$('command').disabled=!enabled;$('run').disabled=!enabled;
$('dot').classList.toggle('connected',connected);
}
async function request(action,body){
const url=new URL(endpoint);
if(url.protocol!=='http:'||url.hostname!=='127.0.0.1')throw Error('Only 127.0.0.1 HTTP is supported');
const response=await fetch(new URL('/'+action,url).href,{
method:'POST',headers:{'Content-Type':'application/json','X-Cluster-Token':token},
body:JSON.stringify(body),signal:AbortSignal.timeout(action==='exec'?120000:10000)
});
let data;try{data=await response.json();}catch{throw Error('Invalid Local Agent response');}
if(!response.ok||!data.ok)throw Error(data.error||String(response.status));return data;
}
async function createSession(){
if(!connected)return;
try{
const result=await request('session/create',{});
if(typeof result.sessionId!=='string'||!result.sessionId)throw Error('Invalid session ID');
const s={id:result.sessionId,name:'PowerShell '+nextLabel++,output:[],draft:'',busy:false};
sessions.set(s.id,s);activate(s.id);$('command').focus();
}catch(error){showError(error);}
}
async function closeSession(id){
const s=sessions.get(id);if(!s||s.busy)return;
try{if(connected)await request('session/close',{sessionId:id});}
catch(error){showError(error);return;}
sessions.delete(id);
if(active===id){active=null;const next=sessions.keys().next().value;if(next)activate(next);else{$('output').textContent='';$('command').value='';}}
renderTabs();syncInput();
}
function showError(error){const s=sessions.get(active);if(s)append(s,t(6)+': '+error.message,true);else $('output').append(escapeOutput(t(6)+': '+error.message,true));}
function palette(data){
const p=data?.palette||data?.data?.palette;
if(p&&typeof p==='object')for(const [k,v] of Object.entries(p))
if(/^[a-z-]+$/.test(k)&&/^#[0-9a-f]{6}$/i.test(v))
document.documentElement.style.setProperty('--ui-'+k,v);
const lang=data?.language||data?.data?.language;
if(labels[lang]){locale=lang;applyLabels();}
}
window.addEventListener('message',e=>{
if(e.source!==parent)return;const m=e.data;
if(['cluster.plugin.v1','cluster.settings.context.v1','cluster.public.v1'].includes(m?.protocol)
&&['context','snapshot','properties.changed'].includes(m.type))palette(m);
});
if(parent!==window){
parent.postMessage({protocol:'cluster.plugin.v1',type:'hello'},'*');
parent.postMessage({protocol:'cluster.public.v1',type:'subscribe',properties:['palette','language']},'*');
}
let registrationCounter=0;
function registerShellCapability(){
if(parent===window)return;
parent.postMessage({protocol:'cluster.plugin.v1',type:'request',
requestId:'powershell-register-'+(++registrationCounter),
method:'PRMU.register',args:['capabilities',{
key:'workspace.powershell.v1',value:{kind:'ui.embed',version:'2.0.0'},
sharedWrite:false,persistent:false}]},'*');
}
registerShellCapability();
$('connect').onclick=async()=>{
endpoint=$('endpoint').value.trim();token=$('token').value.trim();
try{
const reply=await request('health',{});
if(reply.apiVersion!=='2.0.0')throw Error('Update Local Agent to version 2');
connected=true;$('setupGuide').hidden=true;
$('connectPanel').hidden=true;$('connectToggle').setAttribute('aria-expanded','false');
await createSession();
const session=sessions.get(active);if(session)append(session,t(4));
}catch(error){
connected=false;syncInput();showError(error);
$('setupGuide').hidden=false;$('connectPanel').hidden=false;
}
};
$('connectToggle').onclick=()=>{
$('connectPanel').hidden=!$('connectPanel').hidden;
$('connectToggle').setAttribute('aria-expanded',String(!$('connectPanel').hidden));
};
$('copySetup').onclick=()=>{
if(navigator.clipboard?.writeText)navigator.clipboard.writeText('bridge\\Setup-ClusterPowerShell.cmd').catch(()=>{});
};
$('clear').onclick=()=>{
const s=sessions.get(active);if(s){s.output=[];showOutput(s);}
};
$('terminalForm').onsubmit=async event=>{
event.preventDefault();const s=sessions.get(active);
if(!s||s.busy||!connected)return;
const source=$('command').value.trim();if(!source)return;
s.draft='';$('command').value='';s.busy=true;
append(s,'PS> '+source);renderTabs();syncInput();
try{
const result=await request('exec',{sessionId:s.id,command:source});
if(result.output)append(s,result.output);
if(result.error)append(s,result.error,true);
}catch(error){append(s,t(6)+': '+error.message,true);}
finally{s.busy=false;renderTabs();syncInput();}
};
window.addEventListener('pagehide',()=>{
if(!connected)return;
for(const id of sessions.keys())request('session/close',{sessionId:id}).catch(()=>{});
});
applyLabels();syncInput();
$('output').append(escapeOutput('ClusterPowerShell · Local Agent'));
})();
</script></body></html>
