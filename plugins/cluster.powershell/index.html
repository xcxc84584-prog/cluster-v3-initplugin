<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClusterPowerShell</title>
<style>
:root{color-scheme:dark;--ui-background:#101115;--ui-panel:#191c23;--ui-control:#2a2e38;--ui-text:#e5e9f3;--ui-muted:#929bab;--ui-accent:#7e9ef4;--ui-border:#333944;--ui-hover:#343947;--ui-editor:#0c0d10}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--ui-editor);color:var(--ui-text);font:12px system-ui,sans-serif}
main{height:100%;display:flex;flex-direction:column;min-width:240px}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:43px;background:var(--ui-panel);border-bottom:1px solid var(--ui-border)}
header strong{font-size:12px;letter-spacing:.4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ui-muted)}
.dot.connected{background:var(--ui-accent)}.grow{flex:1}
button,input{background:var(--ui-control);border:1px solid var(--ui-border);color:var(--ui-text);border-radius:5px;padding:7px 9px;font:inherit}
button{cursor:pointer}button:hover{background:var(--ui-hover)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:1px}
button:disabled{opacity:.5;cursor:not-allowed}
#tabs{display:flex;align-items:center;gap:3px;overflow-x:auto;min-height:35px;background:var(--ui-panel);border-bottom:1px solid var(--ui-border);padding:0 8px;scrollbar-width:thin}
#tabs button{flex:none;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px;white-space:nowrap}
#tabs button[aria-selected="true"]{border-bottom-color:var(--ui-accent);color:var(--ui-text)}
#tabs .close-tab{font-size:15px;padding:0 5px;border:0;border-radius:3px;color:var(--ui-muted)}
#tabs .close-tab:hover{background:var(--ui-hover)}
#tabs .new-tab{font-size:17px;line-height:1;padding:5px 9px}
#output{flex:1;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 Consolas,"Cascadia Mono",monospace;padding:15px;background:var(--ui-editor)}
#output .error{color:var(--ui-accent);font-weight:600}
form{display:flex;gap:7px;padding:9px 12px;background:var(--ui-panel);border-top:1px solid var(--ui-border)}
#command{flex:1;min-width:0;background:var(--ui-background);font:12px Consolas,monospace}
#connectPanel{border-bottom:1px solid var(--ui-border);padding:11px 13px;background:var(--ui-panel)}
#connectPanel p{line-height:1.6;color:var(--ui-muted);margin:4px 0 9px}
#connectPanel .fields{display:flex;gap:6px;flex-wrap:wrap}
#endpoint{width:210px;max-width:100%}#token{flex:1;min-width:110px}
#setupGuide{margin-top:8px;padding:9px 11px;border:1px solid var(--ui-border);border-radius:6px;background:var(--ui-background)}
#setupGuide ol{margin:7px 0 8px;padding-left:18px;line-height:1.65}
#setupGuide code{font:11px Consolas,monospace;overflow-wrap:anywhere}
.guide-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
[hidden]{display:none!important}

#output{position:relative;padding:0;overflow:hidden}#output .terminal-view{position:absolute;inset:0;padding:7px;overflow:hidden}#output .terminal-view[hidden]{display:none!important}#output .xterm{height:100%}#terminalForm{display:none!important}

/* Inline first-run workstation; no dialog, floating overlay or header setup badge. */
.ps-header{min-height:43px;height:43px;padding:0 15px}
.ps-header strong{font-size:13px}
.ps-state{font:11px system-ui;color:var(--ui-muted)}
.ps-tools{position:relative}
.ps-tool-menu{position:absolute;right:0;top:calc(100% + 5px);z-index:25;width:155px;display:grid;gap:4px;padding:6px;background:var(--ui-panel);border:1px solid var(--ui-border);border-radius:7px;box-shadow:0 10px 28px #0008}
.ps-tool-menu button{text-align:left;background:var(--ui-control)}
.setup-workspace{flex:1;min-height:0;overflow:auto;background:var(--ui-editor);padding:14px 16px 24px}
.setup-wrap{max-width:770px;margin:0 auto;display:grid;gap:9px}
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
.setup-card{min-width:0;padding:13px 15px;background:var(--ui-panel);border:1px solid var(--ui-border);border-radius:10px}
.setup-card-title{display:flex;align-items:flex-start;gap:10px}
.setup-card-title strong{display:block;font-size:12px;line-height:1.55;color:var(--ui-text)}
.setup-card-title p{color:var(--ui-muted);line-height:1.6;margin:3px 0 6px;font-size:11px}
.setup-count{display:inline-grid;place-items:center;flex:none;width:23px;height:23px;border-radius:6px;background:var(--ui-control);color:var(--ui-text);font:600 10px Consolas,monospace}
.setup-card-body{margin-left:33px;display:grid;gap:6px}
.setup-button{font-size:11px;min-width:85px;justify-self:start;padding:8px 13px}
.setup-muted{font-size:11px;color:var(--ui-muted);overflow-wrap:anywhere}
.setup-label{font-size:10px;color:var(--ui-muted)}
#endpoint{width:100%;height:33px}
.setup-connect{display:flex;gap:6px;align-items:center}
#token{min-width:0;width:100%;height:33px;flex:1}
.setup-full{width:100%}
.setup-kicker{font:600 9px Consolas,monospace;letter-spacing:1px;color:var(--ui-muted);margin:0 0 7px 33px}
.setup-status strong{font-size:13px}
.setup-status p{margin:4px 0 0;color:var(--ui-muted);font-size:11px;line-height:1.6}
.setup-preview{background:var(--ui-panel);border:1px solid var(--ui-border);border-radius:7px;font-size:11px}
.setup-preview summary{cursor:pointer;padding:8px 12px}
.setup-preview pre{max-height:150px;overflow:auto;white-space:pre-wrap;padding:5px 12px;color:var(--ui-muted);font:10px/1.6 Consolas,monospace}
.setup-actions button{font-size:11px;padding:8px 14px}
#terminalArea{flex:1;min-height:0;display:flex;flex-direction:column}
#terminalArea[hidden],#connectPanel[hidden]{display:none!important}
@media(max-width:660px){.setup-grid{grid-template-columns:1fr}.setup-workspace{padding:10px}.setup-wrap{max-width:100%}}
</style></head><body><main>
<header class="ps-header">
<strong>PowerShell</strong><span class="grow"></span>
<span id="stateLabel" class="ps-state" role="status"></span>
<div class="ps-tools"><button id="connectToggle" type="button" aria-haspopup="true" aria-expanded="false"></button>
<div id="psToolMenu" class="ps-tool-menu" role="menu" hidden>
<button id="reconfigure" type="button" role="menuitem"></button>
<button id="clear" type="button" role="menuitem"></button>
</div></div>
</header>
<section id="connectPanel" class="setup-workspace">
<div class="setup-wrap">
<div class="setup-grid">
<article class="setup-card">
<div class="setup-card-title"><span class="setup-count">01</span><div><strong id="setupTitle"></strong><p id="setupStep1"></p></div></div>
<div class="setup-card-body"><button id="downloadSetup" type="button" class="setup-button"></button><span id="downloadStatus" class="setup-muted" role="status"></span></div>
</article>
<article class="setup-card">
<div class="setup-card-title"><span class="setup-count">02</span><div><strong id="configureTitle"></strong><p id="setupStep2"></p></div></div>
<div class="setup-card-body">
<label class="setup-label" id="portLabel" for="endpoint"></label>
<input id="endpoint" type="text" aria-label="Local Agent Port or loopback URL" autocomplete="off" spellcheck="false" placeholder="43881">
<label class="setup-label" id="tokenLabel" for="token"></label>
<div class="setup-connect"><input id="token" type="password" aria-label="Session token" autocomplete="off" placeholder="64-character token">
<button id="connect" type="button" class="setup-button"></button></div>
</div></article>
</div>
<article class="setup-card setup-full">
<div class="setup-card-title"><span class="setup-count">03</span><div><strong id="verifyTitle"></strong><p id="setupStep3"></p></div></div>
</article>
<article class="setup-card setup-full setup-status">
<div class="setup-kicker">LOCAL CONNECTION</div>
<strong id="statusTitle"></strong><p id="hint"></p>
</article>
<details class="setup-preview"><summary id="previewTitle"></summary>
<pre id="setupPreview"></pre></details>
<div class="setup-actions"><button id="verifyConnection" type="button"></button></div>
</div>
</section>
<section id="terminalArea" hidden>
<nav id="tabs" role="tablist" aria-label="PowerShell sessions"></nav>
<div id="output" role="log" aria-live="polite"></div>
<form id="terminalForm" hidden>
<input id="command" autocomplete="off" spellcheck="false" aria-label="PowerShell command" disabled placeholder="PS>">
<button id="run" type="submit" disabled>Run</button></form>
</section>
</main><script>
/* Cluster is only the viewport. Native keyboard, ANSI, shell execution and line editing
 * are handled by xterm.js -> WebSocket -> Windows ConPTY -> powershell.exe/pwsh.exe.
 */
(()=>{'use strict';
const $=id=>document.getElementById(id);
const translations={
'zh-TW':['連線','清除','執行','未連接 Local Agent，請先完成快速配置。','已連線','連線失敗','終端錯誤','未連線','新增 PowerShell','關閉分頁','Local Agent 快速配置','將插件 Folder 包下載至 Windows 電腦','在 bridge 資料夾執行以下 CMD，授權網站 Origin','輸入 CMD 顯示的 Port URL 及 Token','複製路徑'],
en:['Connect','Clear','Run','Local Agent is not connected. Complete quick setup first.','Connected','Connection failed','Terminal error','Disconnected','New PowerShell','Close tab','Local Agent quick setup','Download the plugin Folder package on Windows','Run the CMD from bridge and authorize the site origin','Enter the CMD Port URL and Token above','Copy path'],
fr:['Connexion','Effacer','Exécuter','Agent local non connecté. Effectuez la configuration rapide.','Connecté','Échec de connexion','Erreur du terminal','Déconnecté','Nouveau PowerShell','Fermer','Configuration rapide','Télécharger le dossier du plugin sur Windows','Exécutez le CMD dans bridge et autorisez le site','Entrez URL et jeton affichés','Copier le chemin'],
ja:['接続','消去','実行','ローカルエージェントに接続されていません。設定してください。','接続済み','接続失敗','端末エラー','未接続','新しい PowerShell','閉じる','簡単設定','Windows にプラグインフォルダーをダウンロード','bridge 内の CMD を起動しサイトを許可','表示された URL と Token を入力','パスをコピー'],
es:['Conectar','Limpiar','Ejecutar','Agente local no conectado. Complete la configuración.','Conectado','Error de conexión','Error de terminal','Desconectado','Nuevo PowerShell','Cerrar','Configuración rápida','Descargue el plugin Folder a Windows','Ejecute CMD desde bridge y autorice el sitio','Introduzca URL y Token indicados','Copiar ruta'],
hi:['कनेक्ट','साफ़','चलाएँ','लोकल एजेंट कनेक्ट नहीं है। त्वरित सेटअप करें।','कनेक्टेड','कनेक्शन विफल','टर्मिनल त्रुटि','डिस्कनेक्ट','नया PowerShell','टैब बंद','त्वरित सेटअप','Windows पर प्लगइन फ़ोल्डर डाउनलोड करें','bridge का CMD चलाकर वेबसाइट स्वीकार करें','दिखाया गया URL और Token दर्ज करें','पथ कॉपी करें']
};
let locale='zh-TW',endpoint='',token='',connected=false,nextLabel=1,active=null,assetsReady=false;
const sessions=new Map(),container=$('output');
const t=i=>(translations[locale]||translations.en)[i];
function applyLabels(){
 $('connectToggle').textContent=t(0);$('connect').textContent=t(0);
 $('clear').textContent=t(1);$('hint').textContent=t(3);
 $('setupTitle').textContent=t(10);$('setupStep1').textContent=t(11);
 $('setupStep2').textContent=t(12);$('setupStep3').textContent=t(13);
 $('copySetup').textContent=t(14);document.documentElement.lang=locale;renderTabs();
}
function colors(){
 const css=getComputedStyle(document.documentElement);
 const get=k=>css.getPropertyValue('--ui-'+k).trim();
 return {background:get('editor')||'#0c0d10',foreground:get('text')||'#e5e9f3',
 cursor:get('accent')||'#7e9ef4',selectionBackground:get('control')||'#2a2e38'};
}
function palette(context){
 const p=context.palette||context.data?.palette;
 if(p&&typeof p==='object')for(const [k,v] of Object.entries(p)){
  if(/^[a-z-]+$/.test(k)&&/^#[0-9a-f]{6}$/i.test(v))
   document.documentElement.style.setProperty('--ui-'+k,v);
 }
 const lang=context.language||context.data?.language;
 if(translations[lang]){locale=lang;applyLabels();}
 for(const session of sessions.values())session.term.options.theme=colors();
}
window.addEventListener('message',event=>{
 if(event.source!==parent)return;const m=event.data;
 if(['cluster.plugin.v1','cluster.settings.context.v1','cluster.public.v1'].includes(m?.protocol)&&
 ['context','snapshot','properties.changed'].includes(m.type))palette(m);
});
if(parent!==window){
 parent.postMessage({protocol:'cluster.plugin.v1',type:'hello'},'*');
 parent.postMessage({protocol:'cluster.public.v1',type:'subscribe',properties:['palette','language']},'*');
 parent.postMessage({protocol:'cluster.plugin.v1',type:'request',requestId:'powershell-capability-register',
  method:'PRMU.register',args:['capabilities',{
   key:'workspace.powershell.v1',value:{kind:'ui.embed',version:'3.0.0'},
   sharedWrite:false,persistent:false
  }]},'*');
}
function loadScript(src){
 return new Promise((resolve,reject)=>{
 const script=document.createElement('script');
 script.src=src;script.onload=resolve;script.onerror=()=>reject(Error('Failed to load terminal assets'));
 document.head.append(script);
 });
}
async function ensureAssets(){
 if(assetsReady)return;
 const base=new URL(endpoint);
 const css=document.createElement('link');css.rel='stylesheet';css.href=new URL('/assets/xterm.css',base).href;document.head.append(css);
 await loadScript(new URL('/assets/xterm.js',base).href);
 await loadScript(new URL('/assets/fit.js',base).href);
 if(typeof window.Terminal!=='function'||!window.FitAddon?.FitAddon)
  throw Error('Native terminal assets not available');
 assetsReady=true;
}
async function requestHealth(){
 const url=new URL(endpoint);
 if(url.protocol!=='http:'||url.hostname!=='127.0.0.1')
  throw Error('Only loopback HTTP URLs are accepted');
 const response=await fetch(new URL('/health',url).href,{
  method:'POST',headers:{'Content-Type':'application/json','X-Cluster-Token':token},
  body:'{}',signal:AbortSignal.timeout(8000)});
 const json=await response.json();
 if(!response.ok||!json.ok||json.apiVersion!=='3.0.0')
  throw Error(json.error||'A ConPTY Local Agent v3 is required');
}
function renderTabs(){
 const bar=$('tabs');bar.replaceChildren();
 for(const session of sessions.values()){
  const tab=document.createElement('button');tab.type='button';tab.setAttribute('role','tab');
  tab.dataset.id=session.id;tab.setAttribute('aria-selected',String(session.id===active));
  tab.textContent=session.name;tab.onclick=()=>activate(session.id);bar.append(tab);
  const close=document.createElement('button');close.type='button';close.className='close-tab';
  close.textContent='×';close.title=t(9);close.setAttribute('aria-label',t(9)+' '+session.name);
  close.onclick=()=>closeSession(session.id);bar.append(close);
 }
 const plus=document.createElement('button');plus.type='button';plus.className='new-tab';
 plus.textContent='+';plus.disabled=!connected||sessions.size>=12;
 plus.title=t(8);plus.setAttribute('aria-label',t(8));plus.onclick=createSession;bar.append(plus);
}
function activate(id){
 const session=sessions.get(id);if(!session)return;
 active=id;for(const s of sessions.values())s.view.hidden=s.id!==id;
 session.fit.fit();session.term.focus();renderTabs();sendResize(session);
}
function sendResize(session){
 if(session.ws.readyState===WebSocket.OPEN)
  session.ws.send(JSON.stringify({type:'resize',cols:session.term.cols,rows:session.term.rows}));
}
function createSession(){
 if(!connected || sessions.size>=12)return;
 const id='tab-'+crypto.randomUUID();
 const view=document.createElement('div');view.className='terminal-view';view.hidden=true;container.append(view);
 const term=new window.Terminal({
  cursorBlink:true,allowProposedApi:false,convertEol:false,fontSize:13,
  fontFamily:'Cascadia Mono, Consolas, monospace',scrollback:5000,theme:colors()
 });
 const fit=new window.FitAddon.FitAddon();term.loadAddon(fit);term.open(view);
 const wsUrl=new URL(endpoint);wsUrl.protocol='ws:';wsUrl.pathname='/terminal';wsUrl.searchParams.set('token',token);
 const ws=new WebSocket(wsUrl.href);
 const session={id,name:'PowerShell '+nextLabel++,view,term,fit,ws,ptyId:null};
 sessions.set(id,session);
 ws.addEventListener('open',()=>ws.send(JSON.stringify({type:'create'})));
 ws.addEventListener('message',event=>{
  let message;try{message=JSON.parse(event.data);}catch{return;}
  if(message.type==='created'){session.ptyId=message.sessionId;fit.fit();sendResize(session);}
  if(message.type==='data'&&typeof message.data==='string')term.write(message.data);
  if(message.type==='error')term.writeln('\r\n[Local Agent] '+message.error);
  if(message.type==='exit')term.writeln('\r\n[PowerShell exited: '+message.exitCode+']');
 });
 ws.addEventListener('close',()=>term.writeln('\r\n[Local Agent disconnected]'));
 term.onData(data=>{if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'input',data}));});
 term.onResize(()=>sendResize(session));
 const observer=new ResizeObserver(()=>{if(id===active)fit.fit();});
 observer.observe(view);
 session.observer=observer;
 activate(id);
}
function closeSession(id){
 const s=sessions.get(id);if(!s)return;
 try{s.ws.send(JSON.stringify({type:'close'}));}catch{}
 s.ws.close();s.observer.disconnect();s.term.dispose();s.view.remove();sessions.delete(id);
 if(active===id){active=null;const next=sessions.keys().next().value;if(next)activate(next);}
 renderTabs();
}
function setConnected(value){connected=value;$('dot').classList.toggle('connected',value);renderTabs();if(parent!==window)parent.postMessage({protocol:'cluster.powershell.status.v1',connected:value},'*');}
$('connect').onclick=async()=>{
 endpoint=$('endpoint').value.trim();token=$('token').value.trim();
 try{
  await requestHealth();await ensureAssets();
  setConnected(true);$('setupGuide').hidden=true;$('connectPanel').hidden=true;
  $('connectToggle').setAttribute('aria-expanded','false');createSession();
 }catch(error){
  setConnected(false);$('setupGuide').hidden=false;$('connectPanel').hidden=false;
  $('hint').textContent=t(5)+': '+error.message;
 }
};
$('connectToggle').onclick=()=>{
 $('connectPanel').hidden=!$('connectPanel').hidden;
 $('connectToggle').setAttribute('aria-expanded',String(!$('connectPanel').hidden));
};
$('clear').onclick=()=>sessions.get(active)?.term.clear();
$('copySetup').onclick=()=>{
 navigator.clipboard?.writeText('bridge\\Setup-ClusterPowerShell.cmd').catch(()=>{});
};
window.addEventListener('pagehide',()=>{for(const id of Array.from(sessions.keys()))closeSession(id);});
applyLabels();renderTabs();
})();

</script></body></html>
