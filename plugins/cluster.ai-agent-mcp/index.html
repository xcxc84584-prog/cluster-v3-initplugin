<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cluster AI Agent MCP</title><style>
:root{color-scheme:dark;--ui-editor:#0c0d10;--ui-background:#101115;--ui-panel:#191c23;--ui-control:#2a2e38;--ui-text:#e5e9f3;--ui-muted:#929bab;--ui-accent:#7e9ef4;--ui-border:#333944;--ui-hover:#343947}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--ui-editor);color:var(--ui-text);font:12px system-ui,sans-serif}
button,input{font:inherit;color:var(--ui-text);background:var(--ui-control);border:1px solid var(--ui-border);border-radius:6px;padding:8px 10px}
button{cursor:pointer}button:hover{background:var(--ui-hover)}button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
[hidden]{display:none!important}main{height:100%;display:flex;flex-direction:column}
.head{height:45px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--ui-panel);border-bottom:1px solid var(--ui-border)}
.head strong{font-size:13px}.head .grow{flex:1}.state{font:11px Consolas,monospace;color:var(--ui-muted)}
.surface{flex:1;display:flex;min-height:0;min-width:0}
.rail{flex:none;width:var(--agent-rail-width,190px);display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--ui-panel)}
.rail button{display:flex;text-align:left;align-items:center;gap:9px;border:0;border-radius:6px;background:transparent;padding:11px 12px;margin:3px 7px;color:var(--ui-muted)}
.rail button[aria-selected=true]{background:var(--ui-control);color:var(--ui-text);box-shadow:inset 2px 0 var(--ui-accent)}
.rail h2{font:600 10px Consolas,monospace;letter-spacing:.5px;margin:17px 15px 8px;color:var(--ui-muted)}
.divider{width:8px;flex:none;cursor:ew-resize;background:var(--ui-border);position:relative;touch-action:none}
.divider:hover,.divider:focus-visible{background:var(--ui-accent);outline:0}
.divider:after{content:'‹';position:absolute;top:50%;left:0;transform:translateY(-50%);font:11px Consolas;color:var(--ui-text)}
main[data-rail-collapsed=true] .rail{width:0!important}
main[data-rail-collapsed=true] .divider:after{content:'›'}
.content{flex:1;min-width:0;overflow:auto;overflow-anchor:none;padding:16px 19px}
.title{display:flex;align-items:center;gap:9px;margin-bottom:13px}.title h1{margin:0;font-size:17px}
.subtle{color:var(--ui-muted);font-size:11px;line-height:1.6}
.card{border:1px solid var(--ui-border);border-radius:9px;background:var(--ui-panel);padding:15px;min-width:0}
.card h3{font-size:12px;margin:0 0 9px}.card p{font-size:11px;color:var(--ui-muted);line-height:1.6;margin:4px 0 11px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.flow span{padding:7px 10px;border:1px solid var(--ui-border);border-radius:20px;color:var(--ui-muted);font-size:11px}
.flow .current{border-color:var(--ui-accent);color:var(--ui-text)}
.field{display:grid;gap:5px;margin:9px 0}.field label{color:var(--ui-muted);font-size:11px}
.field input{width:100%;min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.action-primary{background:var(--ui-control);border-color:var(--ui-accent)}
.status-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ui-border)}
.status-line:last-child{border:0}.chip{font:10px Consolas,monospace;color:var(--ui-muted)}
.logbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:4px 0 12px;flex-wrap:wrap}
.log-actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.log-actions button{min-width:68px;padding:8px 13px;border:1px solid var(--ui-border);background:var(--ui-control);color:var(--ui-text)}
.log-actions button:hover{background:var(--ui-hover);border-color:var(--ui-accent)}
.log-actions button:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.log-actions .log-clear{border-color:var(--ui-border);color:var(--ui-text)}
.clear-log-dialog{color:var(--ui-text);background:var(--ui-panel);border:1px solid var(--ui-border);border-radius:10px;max-width:min(420px,calc(100vw - 24px));padding:18px;box-shadow:0 15px 55px #0008}
.clear-log-dialog::backdrop{background:#000a}
.clear-log-dialog h3{font-size:14px;margin:0 0 10px}
.clear-log-dialog p{font-size:12px;color:var(--ui-muted);line-height:1.55;margin:0 0 16px}
.clear-log-dialog .actions{justify-content:flex-end;margin:0}
.log{overflow-anchor:none;border:1px solid var(--ui-border);border-radius:8px;overflow:auto;background:var(--ui-background);min-height:200px;max-height:calc(100vh - 175px)}
.log-row{display:grid;grid-template-columns:90px 82px minmax(0,1fr) 64px;gap:9px;padding:10px 12px;border-bottom:1px solid var(--ui-border);font:11px Consolas,monospace;overflow-wrap:anywhere}
.ps-execution-details{grid-column:1/-1;border-top:1px solid var(--ui-border);padding:8px 0 3px}
.ps-execution-details summary{cursor:pointer;color:var(--ui-accent);font:11px system-ui}
.ps-execution-details pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:250px;overflow:auto;font:11px/1.5 Consolas,monospace}
.ps-execution-details strong{display:block;margin-top:8px}
.log-row .time,.log-row .source{color:var(--ui-muted)}.log-row .result{color:var(--ui-accent);text-align:right}
.note{font-size:10px;color:var(--ui-muted);padding:10px 0}
.tool-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--ui-border);padding:8px}
.tool-row:last-child{border:0}.tool-row code{font:11px Consolas,monospace}
.fine{font-size:10px;color:var(--ui-muted)}
.root-list{display:grid;gap:8px;margin-top:9px}
.root-card{background:var(--ui-background);border:1px solid var(--ui-border);border-radius:8px;padding:10px;display:grid;gap:8px}
.root-path{font:11px Consolas,monospace;overflow-wrap:anywhere;color:var(--ui-text)}
.root-rights{display:flex;flex-wrap:wrap;gap:8px}
.root-rights label{display:flex;align-items:center;gap:4px;font:11px system-ui;color:var(--ui-muted)}
.root-rights input{accent-color:var(--ui-accent)}
.root-actions{display:flex;gap:8px;align-items:center;justify-content:space-between}

.approval{position:sticky;top:0;z-index:30;border-color:var(--ui-accent);margin-bottom:12px;box-shadow:0 8px 22px #0007}
.approval p{white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto}
.remember{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ui-muted)}.remember input{accent-color:var(--ui-accent)}
@media(max-width:650px){.cards{grid-template-columns:1fr}.content{padding:10px}.rail{width:145px}.log-row{grid-template-columns:75px 55px minmax(0,1fr)}.log-row .result{display:none}}
</style></head><body>
<main id="app" data-rail-collapsed="false">
 <div class="head"><strong>✧ AI Agent MCP</strong><span class="grow"></span><span id="headerStatus" class="state"></span></div>
 <div class="surface">
  <aside class="rail" id="agentRail"><h2 id="railTitle">AI AGENT</h2>
   <button type="button" data-page="setup" aria-selected="true" id="setupNav"></button>
   <button type="button" data-page="activity" id="activityNav"></button>
   <button type="button" data-page="tools" id="toolsNav"></button>
   <button type="button" data-page="status" id="statusNav"></button>
  </aside>
  <div id="railDivider" class="divider" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Toggle or resize Agent sidebar" aria-valuemin="120" aria-valuemax="340"></div>
  <section class="content">
   <section id="approvalPane" class="card approval" hidden role="region" aria-live="assertive" aria-label="AI action requires approval">
    <h3 id="approvalHeading"></h3><p id="approvalDetail"></p>
    <div class="field" id="approvalPathField" hidden>
     <label for="approvalPath">Absolute Windows root path</label>
     <input id="approvalPath" placeholder="C:\\YourFolder" autocomplete="off" spellcheck="false">
    </div>
    <div class="actions">
     <button id="approveAction" type="button" class="action-primary"></button>
     <button id="denyAction" type="button"></button>
    </div>
   </section>
   <div id="setupPage">
    <div class="title"><h1 id="setupHeading"></h1></div>
    <p class="subtle" id="setupIntro"></p>
    <div class="flow"><span class="current">01 Local Agent</span><span>02 MCP Gateway</span><span>03 OAuth</span><span>04 Verify</span></div>
    <div class="cards">
     <div class="card"><h3 id="agentSetupTitle"></h3><p id="agentSetupDesc"></p>
      <div class="field"><label id="portTitle" for="port"></label><input id="port" placeholder="43881" autocomplete="off" spellcheck="false"></div>
      <div class="field"><label id="tokenTitle" for="pairToken"></label><input type="password" id="pairToken" autocomplete="off"></div>
      <div class="actions"><button id="connect" type="button" class="action-primary"></button><button id="downloadAgent" type="button"></button></div>
      <label class="remember"><input id="remember" type="checkbox"><span id="rememberCaption"></span></label>
      <button id="forget" type="button"></button><span class="fine" id="pairingNote" role="status"></span>
     </div>
     <div class="card"><h3 id="gatewayTitle"></h3><p id="gatewayDesc"></p>
      <div class="actions"><button id="gatewayGuide" type="button"></button></div>
      <div class="fine" id="gatewayLimit"></div>
     </div>
    </div>
    <div class="card"><h3 id="rootHeading">Workspace root permissions</h3>
     <p id="rootInfo">Select a local directory to authorize Explorer file actions. Nothing is accessed before user approval.</p>
     <div class="actions"><button id="selectRoot" type="button">Select local folder</button>
      <button id="revokeRoots" type="button">Revoke folders</button></div>
     <div id="rootList" class="root-list"></div>
    </div>
    <div class="card"><h3 id="verifyTitle"></h3>
     <div class="status-line"><span>Local Agent</span><span class="chip" id="agentStatus">–</span></div>
     <div class="status-line"><span>MCP Gateway</span><span class="chip" id="mcpStatus">–</span></div>
     <div class="status-line"><span>OAuth Gateway</span><span class="chip" id="oauthStatus">–</span></div>
    </div>
    <p id="setupError" role="status" class="note"></p>
   </div>
   <div id="activityPage" hidden>
    <div class="title"><h1 id="activityTitle"></h1></div>
    <div class="logbar"><span id="activitySubtitle" class="subtle"></span>
     <div class="log-actions"><button id="refresh" type="button"></button>
      <button id="export" type="button"></button>
      <button id="clearLog" class="log-clear" type="button"></button></div></div>
    <div id="activityLog" class="log" role="log" aria-live="polite"></div>
    <p id="logNotice" class="note"></p>
    <dialog id="clearLogDialog" class="clear-log-dialog" aria-labelledby="clearLogHeading">
     <h3 id="clearLogHeading"></h3><p id="clearLogDescription"></p>
     <div class="actions">
      <button id="cancelClearLog" type="button"></button>
      <button id="confirmClearLog" class="action-primary" type="button"></button>
     </div>
    </dialog>
   </div>
   <div id="toolsPage" hidden><div class="title"><h1 id="toolsHeading"></h1></div>
    <div class="card"><p id="toolGate"></p><div id="toolCatalog"></div></div>
   </div>
   <div id="statusPage" hidden><div class="title"><h1 id="statusHeading"></h1></div>
    <div class="card"><div id="serviceDetails"></div><div class="actions"><button id="retry" type="button"></button><button id="disconnect" type="button"></button></div></div>
   </div>
  </section>
 </div>
</main>

const vault=(()=>{
 const DB='cluster-ai-agent-pairing-v1';
 function tx(mode,operation){
  return new Promise((resolve,reject)=>{
   const dbreq=indexedDB.open(DB,1);
   dbreq.onupgradeneeded=()=>dbreq.result.createObjectStore('vault');
   dbreq.onerror=()=>reject(dbreq.error);
   dbreq.onsuccess=()=>{
    const db=dbreq.result,store=db.transaction('vault',mode).objectStore('vault');
    let req;try{req=operation(store)}catch(e){db.close();reject(e);return;}
    req.onsuccess=()=>{resolve(req.result);db.close()};
    req.onerror=()=>{reject(req.error);db.close()};
   };
  });
 }
 async function key(){
  let k=await tx('readonly',s=>s.get('key'));if(k)return k;
  k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  await tx('readwrite',s=>s.put(k,'key'));return k;
 }
 return {
  async save(url,secret){
   const iv=crypto.getRandomValues(new Uint8Array(12));
   const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(),new TextEncoder().encode(secret));
   return tx('readwrite',s=>s.put({url,iv:[...iv],data:[...new Uint8Array(data)]},'pairing'));
  },
  async load(){
   const r=await tx('readonly',s=>s.get('pairing'));if(!r)return null;
   const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(r.iv)},await key(),new Uint8Array(r.data));
   return {url:r.url,token:new TextDecoder().decode(bytes)};
  },
  async forget(){return tx('readwrite',s=>s.delete('pairing'));}
 };
})();

function renderEvents(){
 renderingActivity=true;
 const container=activityViewport;
 // Existing DOM nodes and <details> must survive every periodic refresh.
 // Replacing them resets open state, focus, and nested scroll positions.
 const logTop=activityViewInitialized?container.scrollTop:storedActivityTop;
 const outerTop=activityViewInitialized?activityOuter.scrollTop:storedOuterTop;
 // Keep the first visible entry at its current visual position even when
 // the oldest rows roll out of the bounded server-side activity window.
 const anchor=[...container.children].find(row=>
  row.offsetTop+row.offsetHeight>container.scrollTop);
 const anchorKey=anchor?.dataset.eventKey;
 const anchorOffset=anchor?anchor.getBoundingClientRect().top-
  container.getBoundingClientRect().top:0;
 const desired=new Set(events.map(activityKey));
 for(const row of [...container.children]){
  if(!desired.has(row.dataset.eventKey))row.remove();
 }
 const current=new Map([...container.children].map(row=>[row.dataset.eventKey,row]));
 for(let index=0;index<events.length;index++){
  const event=events[index],key=activityKey(event);
  let row=current.get(key);
  if(!row){row=entry(event);current.set(key,row);}
  const at=container.children[index];
  if(at!==row)container.insertBefore(row,at||null);
 }
 const anchored=anchorKey&&[...container.children].find(row=>
  row.dataset.eventKey===anchorKey);
 if(anchored&&activityViewInitialized){
  const moved=anchored.getBoundingClientRect().top-
   container.getBoundingClientRect().top-anchorOffset;
  container.scrollTop=logTop+moved;
 }else container.scrollTop=logTop;
 activityOuter.scrollTop=outerTop;
 activityViewInitialized=true;
 renderingActivity=false;
 saveActivityView();
}

function nativeRoot(raw){

 const segments=raw.split('/').filter(Boolean);
 if(segments.some(x=>x==='.'||x==='..'||x.includes(':')))throw Error('Unsafe relative path');
 const [label,...rest]=segments;
 const root=[...rootHandles.values()].find(r=>r.id===label||r.name===label);
 if(!root)throw Error('Root is not authorized');
 return {root,relative:rest.join('/')};
}
async function requestApproval(title,details,{nativePath=false,timeout=38000}={}){

  const pane=$('approvalPane'),field=$('approvalPathField');
  $('approvalHeading').textContent=title;$('approvalDetail').textContent=details;
  field.hidden=!nativePath;$('approvalPath').value='';
  $('approveAction').textContent=(locale==='zh-TW'?'核准此次操作':'Approve once');
  $('denyAction').textContent=(locale==='zh-TW'?'拒絕':'Deny');
  pane.hidden=false;showPage('activity');
  parent.postMessage({protocol:'cluster.ai-agent.workspace.v1',type:'approval-pending'},'*');
  function settle(value,reason){
   if(!approvalPending)return;
   clearTimeout(approvalPending.timer);approvalPending=null;
   $('approveAction').onclick=null;$('denyAction').onclick=null;pane.hidden=true;
   if(reason)reject(Error(reason));else resolve(value);
  }
  const timer=setTimeout(()=>settle(null,'Approval expired or not confirmed'),timeout);
  approvalPending={timer};
  $('approveAction').onclick=()=>{
   const path=$('approvalPath').value.trim();
   if(nativePath&&!/^[A-Za-z]:\\/.test(path)){
    $('approvalDetail').textContent=details+'\nA valid absolute Windows path is required.';
    return;
   }
   settle({approved:true,absolutePath:path});
  };

 });

}
function connectAgentSocket(){
 if(agentSocket){try{agentSocket.close()}catch{}}
 const url=new URL(endpoint);url.protocol='ws:';url.pathname='/agent';
 url.searchParams.set('token',token);
 const ws=new WebSocket(url);agentSocket=ws;
 ws.onmessage=async e=>{
  let msg;try{msg=JSON.parse(e.data)}catch{return}
  if(msg.type==='tool_call'&&typeof msg.requestId==='string'){
   let result,error;
   try{result=await executeTool(msg.name,msg.args||{});}
   catch(err){error=String(err.message||err).slice(0,250);}
   if(ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({
    type:'tool_result',requestId:msg.requestId,result,error
   }));
  }
 };
 ws.onclose=()=>{if(agentSocket===ws)agentSocket=null;};
}
window.addEventListener('message',event=>{
 if(event.source!==parent||event.data?.protocol!=='cluster.ai-agent.editor.v1'||
  event.data.type!=='rep')return;
 const call=editorCalls.get(event.data.requestId);if(!call)return;
 editorCalls.delete(event.data.requestId);clearTimeout(call.timer);
 if(event.data.ok)call.resolve(event.data.data);
 else call.reject(Error(event.data.error||'Editor refused request'));
});
$('selectRoot').onclick=async()=>{
 if(!connected){$('rootInfo').textContent=rl(10);showPage('setup');return;}
 $('selectRoot').disabled=true;$('rootInfo').textContent=rl(11);
 try{
  const selected=await call('/roots/select',{},190000);
  rootHandles.set(selected.id,selected);rootLabels();
  $('rootInfo').textContent=selected.absolutePath;
 }catch(error){$('rootInfo').textContent=rl(12)+error.message;}
 finally{$('selectRoot').disabled=false;}
};
$('revokeRoots').onclick=async()=>{
 if(!connected){$('rootInfo').textContent=rl(10);return;}
 for(const id of [...rootHandles.keys()]){
  try{await call('/roots/revoke',{id});rootHandles.delete(id);}
  catch(e){$('rootInfo').textContent=e.message;}
 }
 rootLabels();
};
rootLabels();
$('refresh').onclick=refresh;$('retry').onclick=refresh;
$('clearLog').onclick=()=>{
 if(!connected||clearingActivity)return;
 $('clearLogDescription').textContent=lc(2);
 $('clearLogDialog').showModal();
};
$('cancelClearLog').onclick=()=>$('clearLogDialog').close();
$('confirmClearLog').onclick=async()=>{
 if(clearingActivity)return;
 clearingActivity=true;
 activityGeneration++;
 $('confirmClearLog').disabled=true;
 $('clearLog').disabled=true;
 try{
  if(!canClearActivity)throw Error('Outdated Local Agent');
  await call('/activity/clear');
  events=[];
  activityOpenKeys.clear();
  activityViewport.scrollTop=0;
  activityOuter.scrollTop=0;
  storedActivityTop=0;storedOuterTop=0;
  renderEvents();
  $('clearLogDialog').close();
  $('logNotice').textContent=lc(5);
 }catch(error){
  $('clearLogDescription').textContent=!canClearActivity||String(error.message).includes('Unknown route')
   ?lc(7):lc(6)+error.message;
 }finally{
  clearingActivity=false;
  $('confirmClearLog').disabled=false;
  $('clearLog').disabled=false;
 }
};
$('export').onclick=()=>{
 const payload=events.map(({id,at,source,action,result,detail,exitCode,stdout,truncated})=>
  ({id,at,source,action,result,detail,exitCode,stdout,truncated}));
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.download='cluster-ai-agent-activity.json';a.href=url;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
};

$('forget').onclick=async()=>{
 try{await vault.forget();$('remember').checked=false;
  $('pairToken').value='';token='';$('pairingNote').textContent='';}
 catch{$('pairingNote').textContent=sl(3);}
};
vault.load().then(saved=>{
 if(saved&&/^http:\/\/127\.0\.0\.1:\d+\/$/.test(saved.url)&&/^[a-f0-9]{64}$/.test(saved.token)){
  $('port').value=saved.url;$('pairToken').value=saved.token;$('remember').checked=true;
 }
}).catch(()=>{});

function palette(m){
 const p=m.palette||m.data?.palette;if(p&&typeof p==='object')
 for(const [name,value] of Object.entries(p))if(/^[a-z-]+$/.test(name)&&/^#[a-f0-9]{6}$/i.test(value))
  document.documentElement.style.setProperty('--ui-'+name,value);
 const lang=m.language||m.data?.language;
 if(L[lang]){locale=lang;renderLocale();}
}
window.addEventListener('message',e=>{
 if(e.source!==parent)return;const m=e.data;
 if(m?.protocol==='cluster.powershell.setup.v1'&&m.type==='bootstrap-ready'&&typeof m.content==='string')bootstrap=m.content;
 if(['cluster.plugin.v1','cluster.public.v1','cluster.settings.context.v1'].includes(m?.protocol)&&
 ['context','snapshot','properties.changed'].includes(m.type))palette(m);
});
if(parent!==window){
 parent.postMessage({protocol:'cluster.powershell.setup.v1',type:'request-bootstrap'},'*');
 parent.postMessage({protocol:'cluster.plugin.v1',type:'hello'},'*');
 parent.postMessage({protocol:'cluster.public.v1',type:'subscribe',properties:['palette','language']},'*');
 parent.postMessage({protocol:'cluster.plugin.v1',type:'request',requestId:'ai-agent-register',
 method:'PRMU.register',args:['capabilities',{key:'workspace.ai-agent-mcp.v1',
 value:{kind:'ui.embed',version:'0.2.0'},sharedWrite:false,persistent:false}]},'*');
}
renderLocale();showPage('setup');
setInterval(()=>{if(connected&&page==='activity')refresh().catch(()=>{});},4000);
})();
