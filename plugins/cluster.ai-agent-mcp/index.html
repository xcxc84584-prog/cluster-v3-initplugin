<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cluster AI Agent MCP</title><style>
:root{color-scheme:dark;--ui-editor:#0c0d10;--ui-background:#101115;--ui-panel:#191c23;--ui-control:#2a2e38;--ui-text:#e5e9f3;--ui-muted:#929bab;--ui-accent:#7e9ef4;--ui-border:#333944;--ui-hover:#343947}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--ui-editor);color:var(--ui-text);font:12px system-ui,sans-serif}
button,input{font:inherit;color:var(--ui-text);background:var(--ui-control);border:1px solid var(--ui-border);border-radius:6px;padding:8px 10px}
button{cursor:pointer}button:hover{background:var(--ui-hover)}button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
[hidden]{display:none!important}main{height:100%;display:flex;flex-direction:column}
.head{height:45px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--ui-panel);border-bottom:1px solid var(--ui-border)}
.head strong{font-size:13px}.head .grow{flex:1}.state{font:11px Consolas,monospace;color:var(--ui-muted)}
.surface{flex:1;display:flex;min-height:0;min-width:0}
.rail{flex:none;width:var(--agent-rail-width,190px);display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--ui-panel)}
.rail button{display:flex;text-align:left;align-items:center;gap:9px;border:0;border-radius:6px;background:transparent;padding:11px 12px;margin:3px 7px;color:var(--ui-muted)}
.rail button[aria-selected=true]{background:var(--ui-control);color:var(--ui-text);box-shadow:inset 2px 0 var(--ui-accent)}
.rail h2{font:600 10px Consolas,monospace;letter-spacing:.5px;margin:17px 15px 8px;color:var(--ui-muted)}
.divider{width:8px;flex:none;cursor:ew-resize;background:var(--ui-border);position:relative;touch-action:none}
.divider:hover,.divider:focus-visible{background:var(--ui-accent);outline:0}
.divider:after{content:'‹';position:absolute;top:50%;left:0;transform:translateY(-50%);font:11px Consolas;color:var(--ui-text)}
main[data-rail-collapsed=true] .rail{width:0!important}
main[data-rail-collapsed=true] .divider:after{content:'›'}
.content{flex:1;min-width:0;overflow:auto;padding:16px 19px}
.title{display:flex;align-items:center;gap:9px;margin-bottom:13px}.title h1{margin:0;font-size:17px}
.subtle{color:var(--ui-muted);font-size:11px;line-height:1.6}
.card{border:1px solid var(--ui-border);border-radius:9px;background:var(--ui-panel);padding:15px;min-width:0}
.card h3{font-size:12px;margin:0 0 9px}.card p{font-size:11px;color:var(--ui-muted);line-height:1.6;margin:4px 0 11px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.flow span{padding:7px 10px;border:1px solid var(--ui-border);border-radius:20px;color:var(--ui-muted);font-size:11px}
.flow .current{border-color:var(--ui-accent);color:var(--ui-text)}
.field{display:grid;gap:5px;margin:9px 0}.field label{color:var(--ui-muted);font-size:11px}
.field input{width:100%;min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.action-primary{background:var(--ui-control);border-color:var(--ui-accent)}
.status-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ui-border)}
.status-line:last-child{border:0}.chip{font:10px Consolas,monospace;color:var(--ui-muted)}
.logbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:4px 0 12px}
.log{border:1px solid var(--ui-border);border-radius:8px;overflow:auto;background:var(--ui-background);min-height:200px;max-height:calc(100vh - 175px)}
.log-row{display:grid;grid-template-columns:90px 82px minmax(0,1fr) 64px;gap:9px;padding:10px 12px;border-bottom:1px solid var(--ui-border);font:11px Consolas,monospace;overflow-wrap:anywhere}
.log-row .time,.log-row .source{color:var(--ui-muted)}.log-row .result{color:var(--ui-accent);text-align:right}

@media(max-width:650px){.cards{grid-template-columns:1fr}.content{padding:10px}.rail{width:145px}.log-row{grid-template-columns:75px 55px minmax(0,1fr)}.log-row .result{display:none}}

};
const tools=['get_status','get_task_status','list_files','get_editor_state','read_file','list_roots','find_root_windows_path','list_directory','read_path','create_file','write_path','delete_path','open_powershell','powershell_request'];
let locale='zh-TW',endpoint='',token='',connected=false,page='setup',events=[],railOpen=true,railWidth=190,drag=null,bootstrap='';
const secretLabels={
 'zh-TW':['在此裝置記住已授權 Token（加密）','忘記配對','下載 Local Agent CMD','本機儲存不可用'],
 en:['Remember authorized token on this device (encrypted)','Forget pairing','Download Local Agent CMD','Local vault unavailable'],
 fr:['Mémoriser le jeton autorisé (chiffré)','Oublier','Télécharger CMD','Stockage indisponible'],
 ja:['認証トークンを暗号化して保存','保存した認証を削除','CMD ダウンロード','保存できません'],
 es:['Recordar token autorizado (cifrado)','Olvidar','Descargar CMD','Almacenamiento no disponible'],
 hi:['अधिकृत टोकन सुरक्षित रखें','पेयरिंग हटाएँ','CMD डाउनलोड करें','स्टोरेज अनुपलब्ध']
};
const t=n=>(L[locale]||L.en)[n],root=$('app');
const sl=n=>(secretLabels[locale]||secretLabels.en)[n];
function renderLocale(){
 const map={setupNav:2,activityNav:3,toolsNav:4,statusNav:5,setupHeading:6,setupIntro:7,agentSetupTitle:8,agentSetupDesc:9,portTitle:10,tokenTitle:11,connect:12,gatewayTitle:13,gatewayDesc:14,gatewayGuide:15,gatewayLimit:16,verifyTitle:17,activityTitle:18,activitySubtitle:19,refresh:20,export:21,logNotice:22,toolsHeading:23,toolGate:24,statusHeading:25,retry:26,disconnect:27};
 for(const [id,i] of Object.entries(map))$(id).textContent=t(i);
 $('headerStatus').textContent=connected?t(1):t(0);document.documentElement.lang=locale;
 $('rememberCaption').textContent=sl(0);$('forget').textContent=sl(1);$('downloadAgent').textContent=sl(2);
 $('agentStatus').textContent=connected?t(1):t(0);
 $('mcpStatus').textContent=t(29);$('oauthStatus').textContent=t(29);
 $('toolCatalog').replaceChildren();
 for(const name of tools){
  const row=document.createElement('div');row.className='tool-row';
  const code=document.createElement('code');code.textContent='cluster.'+name;
  const state=document.createElement('span');state.className='fine';state.textContent=t(29);
  row.append(code,state);$('toolCatalog').append(row);
 }
}
function showPage(name){
 page=name;
 for(const p of ['setup','activity','tools','status']){
  $(p+'Page').hidden=p!==page;
  document.querySelector('[data-page="'+p+'"]').setAttribute('aria-selected',String(p===page));
 }
}
for(const button of document.querySelectorAll('[data-page]'))button.onclick=()=>showPage(button.dataset.page);
const divider=$('railDivider');
function setRail(open){railOpen=open;root.dataset.railCollapsed=String(!open);
 divider.setAttribute('aria-expanded',String(open));
 try{localStorage.setItem('cluster.ai-agent.rail',JSON.stringify({open,width:railWidth}));}catch{}
}
try{
 const p=JSON.parse(localStorage.getItem('cluster.ai-agent.rail')||'null');
 if(p&&Number.isInteger(p.width))railWidth=Math.max(120,Math.min(340,p.width));
 root.style.setProperty('--agent-rail-width',railWidth+'px');
 if(p&&p.open===false)setRail(false);
}catch{}
divider.addEventListener('pointerdown',e=>{drag={x:e.clientX,width:railWidth,moved:false};
 divider.setPointerCapture(e.pointerId);});
divider.addEventListener('pointermove',e=>{
 if(!drag)return;const dx=e.clientX-drag.x;
 if(Math.abs(dx)>5)drag.moved=true;
 if(drag.moved){railWidth=Math.max(120,Math.min(340,drag.width+dx));
 root.style.setProperty('--agent-rail-width',railWidth+'px');if(!railOpen)setRail(true);}
});
divider.addEventListener('pointerup',()=>{if(!drag)return;
 if(!drag.moved)setRail(!railOpen);else setRail(true);drag=null;
});
divider.addEventListener('dblclick',()=>{railWidth=190;root.style.setProperty('--agent-rail-width','190px');setRail(true);});
divider.addEventListener('keydown',e=>{
 if(e.key==='Enter'||e.key===' '){e.preventDefault();setRail(!railOpen);}
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
  e.preventDefault();railWidth=Math.max(120,Math.min(340,railWidth+(e.key==='ArrowRight'?12:-12)));
  root.style.setProperty('--agent-rail-width',railWidth+'px');setRail(true);
 }
});
/* Optional origin-scoped encrypted vault; no credential enters PRMU. */
const vault=(()=>{
 const DB='cluster-ai-agent-pairing-v1';
 function tx(mode,operation){
  return new Promise((resolve,reject)=>{
   const dbreq=indexedDB.open(DB,1);
   dbreq.onupgradeneeded=()=>dbreq.result.createObjectStore('vault');
   dbreq.onerror=()=>reject(dbreq.error);
   dbreq.onsuccess=()=>{
    const db=dbreq.result,store=db.transaction('vault',mode).objectStore('vault');
    let req;try{req=operation(store)}catch(e){db.close();reject(e);return;}
    req.onsuccess=()=>{resolve(req.result);db.close()};
    req.onerror=()=>{reject(req.error);db.close()};
   };
  });
 }
 async function key(){
  let k=await tx('readonly',s=>s.get('key'));if(k)return k;
  k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  await tx('readwrite',s=>s.put(k,'key'));return k;
 }
 return {
  async save(url,secret){
   const iv=crypto.getRandomValues(new Uint8Array(12));
   const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(),new TextEncoder().encode(secret));
   return tx('readwrite',s=>s.put({url,iv:[...iv],data:[...new Uint8Array(data)]},'pairing'));
  },
  async load(){
   const r=await tx('readonly',s=>s.get('pairing'));if(!r)return null;
   const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(r.iv)},await key(),new Uint8Array(r.data));
   return {url:r.url,token:new TextDecoder().decode(bytes)};
  },
  async forget(){return tx('readwrite',s=>s.delete('pairing'));}
 };
})();
function entry(event){
 const row=document.createElement('div');row.className='log-row';
 for(const value of [new Date(event.at).toLocaleTimeString(),event.source,event.action+' · '+(event.detail||''),event.result]){
  const span=document.createElement('span');span.textContent=value;row.append(span);
 }
 row.children[0].className='time';row.children[1].className='source';row.children[3].className='result';
 return row;
}
function renderEvents(){const container=$('activityLog');container.replaceChildren(...events.map(entry));}
async function call(route){
 const url=new URL(endpoint);
 if(url.protocol!=='http:'||url.hostname!=='127.0.0.1')throw Error('Only loopback HTTP');
 const response=await fetch(new URL(route,url),{method:'POST',
  headers:{'Content-Type':'application/json','X-Cluster-Token':token},
  body:'{}',signal:AbortSignal.timeout(7000)});
 const result=await response.json();
 if(!response.ok||!result.ok)throw Error(result.error||'HTTP '+response.status);
 return result;
}
async function refresh(){
 if(!connected)return;
 try{
  await call('/health');
  const result=await call('/activity');if(!Array.isArray(result.events))throw Error('Invalid agent events');
  events=result.events.filter(e=>typeof e.at==='string'&&typeof e.action==='string').slice(-100);
  renderEvents();$('setupError').textContent='';
 }catch(error){connected=false;renderLocale();$('setupError').textContent=t(33)+error.message;showPage('setup');}
}
$('connect').onclick=async()=>{
 let raw=$('port').value.trim();
 if(/^\d{1,5}$/.test(raw))raw='http://127.0.0.1:'+raw+'/';
 endpoint=raw;token=$('pairToken').value.trim();
 try{
  const health=await call('/health');
  if(health.agent!=='ClusterPowerShell')throw Error('Incorrect Local Agent');
  connected=true;renderLocale();showPage('activity');
  if($('remember').checked)vault.save(endpoint,token).catch(()=>{$('pairingNote').textContent=sl(3)});
  await refresh();
 }catch(error){connected=false;renderLocale();$('setupError').textContent=t(33)+error.message;}
};
$('disconnect').onclick=()=>{connected=false;token='';$('pairToken').value='';renderLocale();showPage('setup');};
$('refresh').onclick=refresh;$('retry').onclick=refresh;
$('export').onclick=()=>{
 const payload=events.map(({id,at,source,action,result,detail})=>({id,at,source,action,result,detail}));
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.download='cluster-ai-agent-activity.json';a.href=url;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
};
$('gatewayGuide').onclick=()=>{showPage('tools');};
$('downloadAgent').onclick=()=>{
 if(!bootstrap){$('pairingNote').textContent='PRMU bootstrap unavailable';return;}
 const url=URL.createObjectURL(new Blob([bootstrap],{type:'application/octet-stream'}));
 const link=document.createElement('a');link.download='ClusterPowerShell-QuickSetup.cmd';
 link.href=url;document.body.append(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
};
$('forget').onclick=async()=>{
 try{await vault.forget();$('remember').checked=false;
  $('pairToken').value='';token='';$('pairingNote').textContent='';}
 catch{$('pairingNote').textContent=sl(3);}
};
vault.load().then(saved=>{
 if(saved&&/^http:\/\/127\.0\.0\.1:\d+\/$/.test(saved.url)&&/^[a-f0-9]{64}$/.test(saved.token)){
  $('port').value=saved.url;$('pairToken').value=saved.token;$('remember').checked=true;
 }
}).catch(()=>{});

function palette(m){
 const p=m.palette||m.data?.palette;if(p&&typeof p==='object')
 for(const [name,value] of Object.entries(p))if(/^[a-z-]+$/.test(name)&&/^#[a-f0-9]{6}$/i.test(value))
  document.documentElement.style.setProperty('--ui-'+name,value);
 const lang=m.language||m.data?.language;
 if(L[lang]){locale=lang;renderLocale();}
}
window.addEventListener('message',e=>{
 if(e.source!==parent)return;const m=e.data;
 if(m?.protocol==='cluster.powershell.setup.v1'&&m.type==='bootstrap-ready'&&typeof m.content==='string')bootstrap=m.content;
 if(['cluster.plugin.v1','cluster.public.v1','cluster.settings.context.v1'].includes(m?.protocol)&&
 ['context','snapshot','properties.changed'].includes(m.type))palette(m);
});
if(parent!==window){
 parent.postMessage({protocol:'cluster.powershell.setup.v1',type:'request-bootstrap'},'*');
 parent.postMessage({protocol:'cluster.plugin.v1',type:'hello'},'*');
 parent.postMessage({protocol:'cluster.public.v1',type:'subscribe',properties:['palette','language']},'*');
 parent.postMessage({protocol:'cluster.plugin.v1',type:'request',requestId:'ai-agent-register',
 method:'PRMU.register',args:['capabilities',{key:'workspace.ai-agent-mcp.v1',
 value:{kind:'ui.embed',version:'0.1.0'},sharedWrite:false,persistent:false}]},'*');
}
renderLocale();showPage('setup');
setInterval(()=>{if(connected&&page==='activity')refresh().catch(()=>{});},4000);
})();
</script></body></html>
